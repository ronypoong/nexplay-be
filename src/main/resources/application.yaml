spring:
  application:
    name: nexplay-be
  # 프로젝트 루트의 .env 를 있으면 읽는다(없어도 기동). 로컬에서는 이 파일로 DB 계정을 넘긴다.
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${NEXPLAY_DB_URL:jdbc:mysql://127.0.0.1:3306/nexplay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${NEXPLAY_DB_USERNAME}
    password: ${NEXPLAY_DB_PASSWORD}
    hikari:
      # 커넥션 하나가 서버·클라이언트 양쪽에 버퍼를 잡는다. 동시 요청이 한 자리
      # 숫자인데 10개를 열어 두면 그만큼 그냥 놀고 있는 메모리다.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 읽기 경로는 캐시가 받아 주지만, 캐시를 채우는 그 한 번은 여전히
        # 게임 458건을 가져온다. 배치로 끊어 오면 왕복이 줄어든다.
        jdbc:
          batch_size: 50
          fetch_size: 200
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Railway 같은 PaaS 는 포트를 실행 시점에 정해 PORT 로 넘긴다.
  # 8080 을 박아두면 "열린 포트가 없다"며 배포가 실패한다.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  compression:
    # Cloudflare 가 앞에서 압축해 주고 있지만, 원본에서 눌러 보내면 그 구간
    # 전송량도 줄어든다. /games 는 439KB 가 113KB 가 된다.
    enabled: true
    mime-types: application/json
    min-response-size: 2048
  tomcat:
    threads:
      # 기본값은 200이다. 스레드마다 스택이 붙으므로 쓰지도 않을 200개를
      # 준비해 둘 이유가 없다. 이 트래픽에는 이걸로 충분하고, 모자라면
      # 큐에 쌓였다가 처리된다.
      max: 32
      min-spare: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    # 어느 커밋이 떠 있는지 밖에서 확인하려는 것뿐이다.
    # env 기여자는 `info.` 로 시작하는 값만 내보낸다 — 다른 환경변수는 나가지 않는다.
    build:
      enabled: true
    env:
      enabled: true

info:
  deploy:
    # Railway 가 배포마다 넣어 주는 값. 로컬에서는 비어 있다.
    commit: ${RAILWAY_GIT_COMMIT_SHA:local}

nexplay:
  intelligence:
    # 뉴스 분류·추출용 API 키. 비우면 기능 전체가 꺼진다.
    # 조용히 엉뚱한 값을 쓰느니 아무것도 안 하는 편이 낫다.
    api-key: ${NEXPLAY_INTELLIGENCE_API_KEY:}
    model: ${NEXPLAY_INTELLIGENCE_MODEL:gpt-5.4-nano}
    base-url: ${NEXPLAY_INTELLIGENCE_BASE_URL:https://api.openai.com/v1}
    # 100만 토큰당 달러. 2026-08-28 확인한 값이다. OpenAI 가 단가를 바꾸면
    # 여기만 고치면 된다. 표에 없는 모델은 금액을 추정하지 않는다 —
    # 모르는 것을 0 으로 적으면 거짓말이 된다.
    # 키를 대괄호로 감싼다. 그냥 쓰면 Spring 이 점을 중첩으로 읽어
    # gpt-5.4-nano 가 gpt -> 5 -> 4-nano 로 쪼개진다.
    pricing:
      "[gpt-5.4-nano]": { input: 0.20, output: 1.25 }
      "[gpt-5.4-mini]": { input: 0.75, output: 4.50 }
      "[gpt-5.4]": { input: 2.50, output: 15.00 }
    # 아끼려는 상한이 아니라 폭주 방지선이다. 설정 실수나 버그로 호출이
    # 무한정 나가는 걸 막는다. 하루가 바뀌면 저절로 풀린다.
    #
    # 실측: 소식 분류 1,234토큰 + 약속 추출 1,200토큰 = 소식 1건에 약 2,434토큰.
    # 둘이 같은 예산을 나눠 쓴다.
    #
    # 하루 유입이 20~36건이고 패치노트 36%를 빼면 13~23건을 처리한다.
    #   유입 20건 -> 31,642 토큰
    #   유입 36건 -> 55,982 토큰
    # 6만이면 가장 바쁜 날도 덮는다. 3만으로 내리면 거의 매일 중간에 끊긴다.
    #
    # 이 상한은 DB 에서 읽는다. 메모리 카운터일 때는 배포마다 0 으로 돌아가서,
    # 하루에 열 번 배포하면 상한이 열 번 풀렸다.
    daily-token-budget: ${NEXPLAY_INTELLIGENCE_DAILY_TOKEN_BUDGET:60000}
    # 분류가 쓸 몫. 나머지는 약속 추출이 쓴다. 하나의 예산을 나눠 쓰게 두면
    # 먼저 도는 쪽이 다 먹어, 밀린 분류가 없어질 때까지 약속은 한 달을 굶는다.
    event-share: ${NEXPLAY_INTELLIGENCE_EVENT_SHARE:0.6}
    # 모델에 넣는 본문 길이. 실제 소식으로 재 보니 4,000자를 1,200자로 줄여도
    # 결과가 거의 같았고 입력 토큰은 34% 줄었다. 중요한 사실은 앞에 나온다.
    max-body-chars: ${NEXPLAY_INTELLIGENCE_MAX_BODY_CHARS:1200}
  archive:
    # 수집 원문 보관 기간. 시간이 지날수록 값이 오르는 자산이라 길게 잡는다.
    raw-retention-days: ${NEXPLAY_RAW_RETENTION_DAYS:3650}
  anticipation:
    # IP 해시에 섞는 소금. 비어 있으면 기대 투표가 400 으로 거부된다 —
    # 소금 없는 해시는 그대로 IP 의 별칭이라 익명이 아니다.
    salt: ${NEXPLAY_ANTICIPATION_SALT:}
    daily-limit: ${NEXPLAY_ANTICIPATION_DAILY_LIMIT:40}
    # 투표자 해시를 되돌릴 수 없게 바꾸기까지의 기간. 처리방침에 적은 값과 같아야 한다.
    hash-retention-days: ${NEXPLAY_ANTICIPATION_HASH_RETENTION_DAYS:180}
  admin:
    # 비어 있으면 관리 API 는 503 으로 막힌다. 설정을 잊었을 때 열리는 것보다 닫히는 편이 안전하다.
    token: ${NEXPLAY_ADMIN_TOKEN:}
    # 토큰이 새더라도 무제한으로 쓰지 못하게 한다. 수집 작업은 무거워서
    # 반복 호출만으로도 서비스를 눕힐 수 있다.
    max-requests-per-minute: ${NEXPLAY_ADMIN_MAX_RPM:60}
    # 틀린 토큰을 계속 던지는 것은 정상 사용이 아니다. 그런 주소는 한 시간 잠근다.
    max-failures-per-hour: ${NEXPLAY_ADMIN_MAX_FAILURES:10}
  cors:
    allowed-origins: "${NEXPLAY_CORS_ALLOWED_ORIGINS:https://nexplay.rubi-on.com,http://localhost:3003,http://127.0.0.1:3003}"
  daily-sync:
    cron: ${NEXPLAY_DAILY_SYNC_CRON:0 0 6 * * *}
    zone: ${NEXPLAY_DAILY_SYNC_ZONE:Asia/Seoul}
  catalog:
    # 한 번 돌 때 새로 구독할 게임 수. 스팀 ID 가 있는 455개 중 85개만 보고 있었다.
    max-new-subscriptions-per-run: ${NEXPLAY_MAX_NEW_SUBSCRIPTIONS:120}
    steam-store:
      timeout-seconds: 12
      # 며칠 지나면 Steam 을 다시 보는가. 458건을 하루 200건씩 도니 한 바퀴가 2.3일이다.
      recheck-after-days: ${NEXPLAY_STEAM_RECHECK_DAYS:3}
    wikidata:
      timeout-seconds: 60
      max-rows: 500
  collector:
    steam:
      timeout-seconds: 15
