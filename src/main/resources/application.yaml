spring:
  application:
    name: nexplay-be
  # 프로젝트 루트의 .env 를 있으면 읽는다(없어도 기동). 로컬에서는 이 파일로 DB 계정을 넘긴다.
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${NEXPLAY_DB_URL:jdbc:mysql://127.0.0.1:3306/nexplay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${NEXPLAY_DB_USERNAME}
    password: ${NEXPLAY_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nexplay:
  cors:
    allowed-origins: "${NEXPLAY_CORS_ALLOWED_ORIGINS:http://localhost:3003,http://127.0.0.1:3003}"
  daily-sync:
    cron: ${NEXPLAY_DAILY_SYNC_CRON:0 0 6 * * *}
    zone: ${NEXPLAY_DAILY_SYNC_ZONE:Asia/Seoul}
  catalog:
    steam-store:
      timeout-seconds: 12
    wikidata:
      timeout-seconds: 60
      max-rows: 500
  collector:
    steam:
      timeout-seconds: 15
