plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.rubion'
version = '0.0.1-SNAPSHOT'
description = 'nexplay-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // REDIS_URL 이 비어 있으면 쓰이지 않는다. 그때는 Caffeine 이 그대로 캐시를 맡는다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    // 이벤트 분류·구조화 추출용. 키가 없으면 기능 자체가 꺼진다.
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootJar 와 함께 실행 불가능한 -plain.jar 가 생긴다.
// Dockerfile 의 COPY build/libs/*.jar 가 두 개를 집어 실패하고,
// Railway 기본 실행 명령도 어느 쪽을 고를지 알 수 없다.
tasks.named('jar') {
    enabled = false
}

/*
 * 배포된 것이 언제 빌드된 것인지 밖에서 확인할 수 있게 한다.
 *
 * 예전에 푸시가 GitHub 쪽 오류로 안 올라갔는데 그걸 모르고 옛 코드에 대고
 * 동기화를 열일곱 번 돌린 적이 있다. "올렸으니 떠 있겠지" 를 확인할 방법이
 * 없으면 같은 일이 또 난다.
 *
 * 커밋 해시는 여기서 넣지 않는다. Dockerfile 이 .git 을 복사하지 않아
 * 컨테이너 안에서는 git 을 부를 수 없다. 커밋은 Railway 가 넘겨주는
 * 환경변수를 application.yaml 에서 받는다.
 */
springBoot {
    buildInfo()
}
